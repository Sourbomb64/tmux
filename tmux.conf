# TMUX 
TMUX_BASE_PATH="$HOME/.config/tmux"
TMUX_CONF_PATH="$TMUX_BASE_PATH/plugin-config"
TMUX_PLUGINS_PATH="$TMUX_BASE_PATH/plugins"

# Mouse Support
set -g mouse on

# Key to reload config
unbind r
bind r source-file ${TMUX_BASE_PATH}/tmux.conf \; display-message "󰄳 Config Reloaded 󱁖 "

# TPM (Tmux Plugin Manager)
## Setting plugins install in .config/tmux dirctory
set-environment -g TMUX_PLUGIN_MANAGER_PATH ${TMUX_PLUGINS_PATH} 

## List of Plugins
### Base
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
### Rose Pine Theme
set -g @plugin 'rose-pine/tmux'
## End of plugins list

## Sourcing Configs
### Rose Pine Theme Config
source-file ${TMUX_CONF_PATH}/rose-pine.conf
## End of Sourcing Configs

## Initialize TMUX plugin manager (Keep at bottom)
run "${TMUX_PLUGINS_PATH}/tpm/tpm"

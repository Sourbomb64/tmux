# This hold how tmux new sesstion layout.

rename-window "main"
## Create a thin 4-line top pane and start the Pomodoro timer
split-window -v -b -l 4

## Move down and split the main workspace 50:50
select-pane -D
split-window -h
select-pane -L

## Open two background shell windows
new-window -d
new-window -d
